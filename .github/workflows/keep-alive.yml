name: Keep Render PDF Service Awake

on:
  schedule:
    - cron: "*/8 * * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Health Endpoint
        run: |
          curl --fail --silent --show-error \
            --max-time 90 \
            -X GET \
            "https://onething-pdf-service.onrender.com/health" \
            -H "accept: */*"
